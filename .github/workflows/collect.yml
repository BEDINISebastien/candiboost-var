
name: Collecte automatique CandiBoost Var

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6,16 * * *'

permissions:
  contents: write

concurrency:
  group: candiboost-collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: Collecter les offres
        run: python collect.py

      - name: Enregistrer les nouvelles offres
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offres.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation automatique des offres"
            git push
          fi
